tasks:
  - id: plan
    agent: researcher
    kind: research_plan
    title: 研究规划
    depends_on: []
    tools: []
    mode: direct
    output_schema: ResearchPlan
    description: |
      ## 研究主题
      {{ topic }}

      ## 用户关注点
      {{ focus or "未特别指定，请覆盖市场规模、竞争格局、产业链、趋势与风险" }}

      ## 任务
      把研究主题拆解为 3-4 个可检索的子问题，为每个子问题设计 1-3 条具体检索词（包含年份、关键实体），
      并给出 6-7 个章节的报告大纲。检索词要覆盖“市场数据、竞争格局、产业链、政策与风险”四类信息。

  - id: collect_web
    agent: researcher
    kind: web_research
    title: 联网证据收集
    depends_on: [plan]
    tools: [search_web, fetch_page, calculator]
    mode: react
    output_schema: EvidenceBundle
    coverage_check: true
    description: |
      ## 研究主题
      {{ topic }}

      ## 任务
      使用 search_web 完成至少 2 组检索，并使用 fetch_page 至少精读 1 篇搜索结果，收集市场规模、增速、
      竞争格局、产业链与政策风险等关键事实。
      每条证据必须保留可访问 URL 与原文摘要；不得把推测写成事实。
      输出 EvidenceBundle 时：items 最多 8 条，每条 detail 不超过 120 字、claim 一句话；
      装不下的信息写入 gaps，不要大段复制原文，避免输出被截断。
      最后输出 EvidenceBundle JSON，证据编号从 E1 开始。

  - id: collect_kb
    agent: researcher
    kind: kb_research
    title: 私有研报检索
    depends_on: [plan]
    tools: [kb_search]
    mode: react
    output_schema: EvidenceBundle
    description: |
      ## 研究主题
      {{ topic }}

      ## 任务
      使用 kb_search 在本地研报知识库中完成至少 2 组语义检索，优先提取市场规模、财务指标、公司份额、
      毛利率等可从研报中核对的数据。
      每条证据保留研报文件名、页码与检索相似度。若知识库未命中，请如实写入 gaps。
      输出 EvidenceBundle 时：items 最多 8 条，每条 detail 不超过 120 字、claim 一句话；
      装不下的信息写入 gaps，不要大段复制原文，避免输出被截断。
      最后输出 EvidenceBundle JSON，证据编号从 E1 开始。

  - id: merge_evidence
    agent: researcher
    kind: merge_evidence
    title: 证据合并与编号
    depends_on: [collect_web, collect_kb]
    tools: []
    mode: direct
    output_schema: EvidenceBundle
    description: |
      将联网证据与私有研报证据合并、去重并统一编号，形成后续分析唯一可引用的证据包。

  - id: analyze
    agent: analyst
    kind: analysis
    title: 交叉核对与结构化分析
    depends_on: [plan, merge_evidence]
    tools: [calculator, kb_search]
    mode: direct
    output_schema: AnalysisReport
    description: |
      ## 研究主题
      {{ topic }}

      ## 任务
      汇总联网证据与私有研报证据，完成口径核对、趋势判断与竞争格局分析：
      1. 合并重复证据，标记相互矛盾的数字并说明取舍；
      2. 用 calculator 校验增速、CAGR、份额等派生指标；
      3. 输出结构化分析 JSON，所有关键数字必须带 evidence_ids。
      对于证据不足的字段，写“未获取”，不要编造。

  - id: write
    agent: writer
    kind: report_writing
    title: 长文报告撰写
    depends_on: [plan, merge_evidence, analyze]
    tools: []
    mode: long_form
    min_chars: 4000
    min_citations: 6
    require_table: true
    required_sections:
      - 核心摘要
      - 市场规模
      - 竞争格局
      - 产业链
      - 趋势
      - 风险
      - 结论
    description: |
      ## 研究主题
      {{ topic }}

      ## 任务
      基于研究规划、证据包与结构化分析，撰写一份完整的中文行业研究报告。
      要求：结论先行；关键数据后用 [E#] 标注证据；至少包含 1 张 Markdown 表格；
      区分事实与判断；在末尾给出研究局限与数据缺口。
      系统会按大纲逐章节调度写作，你只需完成当前章节。
